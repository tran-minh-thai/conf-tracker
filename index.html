<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PaperClock</title>
  <meta name="description" content="Computer science calls for papers with CCF and CORE ranks, acceptance rates, calendar export and a personal submission plan." />
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg?v=13" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=13" />
  <link rel="stylesheet" href="assets/styles.css?v=13" />
  <link rel="alternate" type="text/calendar" title="PaperClock: ranked conference deadlines" href="data/deadlines.ics" />
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { const t = localStorage.getItem("conf_tracker_theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><img src="assets/icon.svg?v=13" alt="" width="38" height="38" /></span>
        <div class="brand-text">
          <h1 id="app-name">PaperClock</h1>
          <p id="tagline"></p>
        </div>
      </div>
      <div class="top-actions">
        <span id="fresh" class="fresh" aria-live="polite"></span>
        <button id="btn-loc" class="btn" type="button"></button>
        <button id="btn-subscribe" class="btn" type="button"></button>
        <label class="sr-only" for="lang">Language</label>
        <select id="lang" class="btn" aria-label="Language">
          <option value="en">EN</option>
          <option value="vi">VI</option>
        </select>
        <button id="btn-theme" class="btn icon-only" type="button" aria-label="Theme"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 14.5A8 8 0 019.5 4.5a8 8 0 1010 10z"/></svg></button>
      </div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Views">
      <button class="tab" role="tab" data-view="list" id="tab-list"></button>
      <button class="tab" role="tab" data-view="foryou" id="tab-foryou"></button>
      <button class="tab" role="tab" data-view="calendar" id="tab-calendar"></button>
      <button class="tab" role="tab" data-view="plan" id="tab-plan"></button>
      <button class="tab" role="tab" data-view="pubs" id="tab-pubs"></button>
    </nav>
  </header>

  <main id="layout" class="layout">
    <aside id="filters" class="panel" aria-label="Filters"></aside>
    <section id="view" aria-live="polite">
      <div id="loading" class="skeleton-list" aria-label="Loading"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
    </section>
  </main>

  <footer><span id="footer"></span> <a href="privacy.html">Privacy policy</a></footer>

  <dialog id="dlg-subscribe">
    <h2 id="sub-title"></h2>
    <p id="sub-body"></p>
    <div class="copy-row">
      <input id="sub-url" readonly aria-label="Feed URL" />
      <button class="btn" type="button" data-action="copy-feed" id="sub-copy"></button>
    </div>
    <p><a id="sub-download" href="data/deadlines.ics" download>deadlines.ics</a></p>
    <form method="dialog"><button class="btn" id="sub-close"></button></form>
  </dialog>

  <dialog id="dlg-loc">
    <h2 id="loc-title"></h2>
    <label class="field"><span id="loc-country-label"></span><select id="loc-country"></select></label>
    <label class="field"><span id="loc-city-label"></span><select id="loc-city"></select></label>
    <p><button class="btn" type="button" id="loc-precise"></button></p>
    <p class="hint" id="loc-note"></p>
    <p class="hint" id="loc-status" role="status"></p>
    <form method="dialog" class="dlg-actions">
      <button class="btn primary" id="loc-save"></button>
      <button class="btn" id="loc-close"></button>
    </form>
  </dialog>

  <input type="file" id="plan-file" accept="application/json,.json" hidden />
  <div id="toast" class="toast" role="status"></div>

  <script type="module" src="assets/app.js?v=13"></script>
</body>
</html>
