name: Update conference deadlines

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q tests

      - name: Fetch deadlines
        # Exits non-zero (and writes nothing) on validation errors, malformed
        # curated data, or a drop to under half of the previous venue count.
        run: python scripts/fetch_conferences.py

      - name: Commit updated data
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/conferences.json data/deadlines.ics
          git diff --staged --quiet || git commit -m "chore: update conference deadlines"
          git push
