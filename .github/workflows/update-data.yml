name: Update Conference Deadlines

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests PyYAML beautifulsoup4
          fi

      - name: Run crawler script
        run: python scripts/fetch_conferences.py

      - name: Commit and push updated JSON
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/conferences.json
          git diff --staged --quiet || git commit -m "chore: update conference deadlines"
          git push
