name: Update journal access and citation data

on:
  schedule:
    - cron: "0 4 * * 1"   # weekly, Monday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  journal-info:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q tests

      - name: Build journal access model and citation figures (DOAJ CSV and OpenAlex, both CC0)
        run: python scripts/build_journal_info.py

      - name: Commit the data
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/journal_info.json
          git diff --staged --quiet || git commit -m "chore: update journal access data"
          git pull --rebase
          git push
